<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday, Manisha 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;
    overflow:hidden;
    font-family:'Poppins',sans-serif;
    background:radial-gradient(circle at top,#ffeef4,#fbcfe8 40%,#f9a8d4 80%);
    animation:glowPulse 4s ease-in-out infinite;
  }
  @keyframes glowPulse{
    0%,100%{background:radial-gradient(circle at top,#ffeef4,#fbcfe8 40%,#f9a8d4 80%);}
    50%{background:radial-gradient(circle at top,#ffd9e8,#f9a8d4 40%,#f472b6 80%);}
  }

  .container{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100%;
    position:relative;
    overflow:hidden;
  }

  audio{display:none;}

  /* Tap to Begin */
  #startOverlay{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:radial-gradient(circle at center,#ffeaf3,#f9a8d4);
    display:flex;flex-direction:column;
    justify-content:center;align-items:center;
    z-index:999;
    animation:fadeIn 1.2s ease;
  }
  #startOverlay h2{
    font-family:'Playfair Display',serif;
    font-size:2rem;
    background:linear-gradient(90deg,#ec4899,#f9a8d4,#fbcfe8);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.05);}
  }
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

  /* Message box */
  .message-box{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    background:#fff;
    color:#b91c1c;
    padding:15px 25px;
    border-radius:18px;
    font-size:18px;
    box-shadow:0 6px 25px rgba(236,72,153,0.25);
    text-align:center;
    max-width:80%;
    opacity:0;
    animation:fadeSlide 8s ease forwards;
  }

  @keyframes fadeSlide{
    0%{opacity:0;transform:translate(-50%,30px);}
    10%{opacity:1;transform:translate(-50%,0);}
    80%{opacity:1;}
    100%{opacity:0;transform:translate(-50%,-30px);}
  }

  /* Sparkles */
  .sparkle{
    position:absolute;width:6px;height:6px;
    background:radial-gradient(circle,#fff,#ec4899);
    border-radius:50%;opacity:0.7;
    animation:sparkleAnim 4s linear infinite;
  }
  @keyframes sparkleAnim{
    0%{transform:translateY(0) scale(1);opacity:0.7;}
    50%{transform:translateY(-50px) scale(1.3);opacity:1;}
    100%{transform:translateY(-100px) scale(.8);opacity:0;}
  }

  /* Floating Hearts */
  .heart{
    position:absolute;font-size:20px;
    animation:floatHeart 6s ease-in-out infinite;
    opacity:0.7;
  }
  @keyframes floatHeart{
    0%{transform:translateY(100vh) scale(0.8);opacity:0.7;}
    50%{opacity:1;}
    100%{transform:translateY(-20vh) scale(1.1);opacity:0;}
  }

  /* Cake Section */
  #cakeSection{
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100%;
    text-align:center;
  }

  h1{
    font-family:'Playfair Display',serif;
    font-size:clamp(36px,5vw,64px);
    background:linear-gradient(90deg,#ff5f9a,#ff94b7,#ffc1d9);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    margin-bottom:10px;
  }

  p{
    font-size:18px;
    color:#b44b6e;
    margin-bottom:30px;
  }

  .cake{
    position:relative;
    width:280px;
    height:240px;
    transform:translateY(40px);
  }

  .layer{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    border-radius:14px;
    box-shadow:0 8px 20px rgba(255,182,193,0.4),
                inset 0 2px 5px rgba(255,255,255,0.4);
    opacity:0;
    animation:fadeInLayer 1s ease forwards;
  }

  @keyframes fadeInLayer{to{opacity:1;transform:translateX(-50%) scale(1);}}

  .layer.bottom{width:280px;height:70px;bottom:0;
    background:linear-gradient(180deg,#ff7ea8 0%,#e96590 40%,#d94f7b 100%);
    animation-delay:0.4s;}
  .layer.middle{width:240px;height:60px;bottom:65px;
    background:linear-gradient(180deg,#ffa5c1 0%,#f785a9 50%,#e5668f 100%);
    animation-delay:1s;}
  .layer.top{width:200px;height:55px;bottom:120px;
    background:linear-gradient(180deg,#ffd7e5 0%,#ffb9cf 50%,#f598b6 100%);
    animation-delay:1.6s;}

  .icing{
    position:absolute;top:36px;left:50%;
    transform:translateX(-50%);
    width:200px;height:30px;
    background:linear-gradient(180deg,#fffefb 0%,#fff2f5 70%);
    border-radius:16px;
    box-shadow:inset 0 -4px 6px rgba(0,0,0,0.1),
                0 3px 8px rgba(255,255,255,0.6);
    opacity:0;animation:fadeIn 1s ease 2.2s forwards;
  }

  .candle{
    position:absolute;top:-10px;left:50%;
    transform:translateX(-50%) scale(0);
    width:14px;height:55px;
    border-radius:7px;
    background:linear-gradient(90deg,#ffb6c1,#ffd4dd,#ffb6c1);
    animation:popUp 0.8s ease 2.8s forwards;
  }

  @keyframes popUp{to{transform:translateX(-50%) scale(1);opacity:1;}}

  .candle::before{
    content:"";position:absolute;top:-10px;left:50%;
    transform:translateX(-50%);
    width:3px;height:12px;background:#1a1a1a;
  }

  .flame{
    position:absolute;top:-37px;left:50%;
    transform:translateX(-50%) scale(0);
    width:20px;height:30px;border-radius:50%;
    background:radial-gradient(ellipse at center bottom,#fff,#ffe8ef 25%,#ffb3c6 60%,#ff6fa7 90%);
    filter:blur(1px);
    opacity:0;
    animation:flameUp 0.6s ease 3.4s forwards, flicker 0.18s infinite alternate 4.2s;
    box-shadow:0 0 25px 8px rgba(255,140,170,0.7);
  }

  @keyframes flameUp{to{opacity:1;transform:translateX(-50%) scale(1);}}
  @keyframes flicker{
    0%{transform:translateX(-50%) scale(0.95);}
    100%{transform:translateX(-50%) scale(1.05) translateY(-2px);}
  }

  button{
    margin-top:100px;
    padding:16px 50px;
    font-size:20px;
    font-weight:600;
    border:none;
    border-radius:40px;
    cursor:pointer;
    background:linear-gradient(90deg,#ff7aa2,#ff94b7,#ffc1d9);
    color:#fff;
    box-shadow:0 8px 30px rgba(255,120,160,0.4);
    transition:all 0.3s ease;
  }
  button:hover{
    transform:scale(1.05) translateY(-2px);
    box-shadow:0 10px 40px rgba(255,120,160,0.6);
  }
</style>
</head>
<body>

<audio id="bgMusic" src="music1.mp3" loop></audio>

<div id="startOverlay"><h2>💖 Tap to Begin 💖</h2></div>

<!-- Main container for messages -->
<div class="container" id="mainContent" style="display:none;"></div>

<!-- Cake section -->
<div id="cakeSection">
  <h1>Happy Birthday, Manisha 🌸</h1>
  <p>Wishing you a day as sweet and lovely as you 💕</p>
  <div class="cake">
    <div class="layer bottom"></div>
    <div class="layer middle"></div>
    <div class="layer top"></div>
    <div class="icing"></div>
    <div class="candle"></div>
    <div class="flame"></div>
  </div>
  <button onclick="celebrate()">Celebrate 💖</button>
</div>

<script>
const music=document.getElementById("bgMusic");
const overlay=document.getElementById("startOverlay");
const main=document.getElementById("mainContent");
const cake=document.getElementById("cakeSection");

const messages=[
  "Hey Manisha 💕",
  "Today’s your special day 🎂",
  "You deserve every smile and every hug ✨",
  "Because you bring light everywhere you go 💫",
  "Here’s to more laughter and memories 💖",
  "Ready for your surprise? 🎉"
];

overlay.addEventListener("click",()=>{
  overlay.style.display="none";
  main.style.display="flex";

  // Start music fade-in
  music.play();
  music.volume=0;
  const fade=setInterval(()=>{
    if(music.volume<1) music.volume+=0.02;
    else clearInterval(fade);
  },200);

  // Sparkles
  for(let i=0;i<25;i++){
    const s=document.createElement('div');
    s.className='sparkle';
    s.style.left=Math.random()*100+'vw';
    s.style.top=Math.random()*100+'vh';
    s.style.animationDuration=(2+Math.random()*3)+'s';
    document.body.appendChild(s);
  }

  // Hearts
  function createHeart(){
    const h=document.createElement('div');
    h.className='heart';
    h.textContent=['💖','💝','💕','💗'][Math.floor(Math.random()*4)];
    h.style.left=Math.random()*100+'vw';
    h.style.animationDuration=(5+Math.random()*4)+'s';
    h.style.fontSize=(16+Math.random()*16)+'px';
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),8000);
  }
  setInterval(createHeart,600);

  // Messages (each 8s)
  let delay=0;
  messages.forEach((msg,i)=>{
    setTimeout(()=>{
      const box=document.createElement('div');
      box.className='message-box';
      box.style.top='45%';
      box.textContent=msg;
      main.appendChild(box);
      setTimeout(()=>box.remove(),8000);
    },i*8300);
    delay=i*8300;
  });

  // Transition to cake after last
  setTimeout(()=>{
    main.style.animation="fadeOut 2s ease forwards";
    setTimeout(()=>{
      main.style.display="none";
      cake.style.display="flex";
    },2000);
  },delay+6000);
});

// Celebrate button
function celebrate(){
  const btn=document.querySelector('button');
  btn.textContent='🍰 Cutting the Cake...';
  btn.disabled=true;

  const cake=document.querySelector('.cake');
  cake.animate([
    {transform:'translateY(40px) scale(1)'},
    {transform:'translateY(20px) scale(1.05)'},
    {transform:'translateY(40px) scale(1)'}
  ],{duration:1200,iterations:2,easing:'ease-in-out'});

  // Confetti
  for(let i=0;i<60;i++){
    const conf=document.createElement('div');
    conf.style.position='fixed';
    conf.style.left=Math.random()*100+'vw';
    conf.style.top='50vh';
    conf.style.width='8px';
    conf.style.height='8px';
    conf.style.borderRadius='50%';
    conf.style.background=['#ff94b7','#ff6fa7','#ffc1d9','#fff'][Math.floor(Math.random()*4)];
    conf.style.opacity=0.9;
    conf.style.zIndex=1000;
    document.body.appendChild(conf);
    const x=(Math.random()-0.5)*400;
    const y=(Math.random()-1)*600;
    conf.animate([
      {transform:`translate(0,0) scale(1)`},
      {transform:`translate(${x}px,${y}px) scale(1.5)`,opacity:0}
    ],{duration:1800+Math.random()*1000,easing:'ease-out'});
    setTimeout(()=>conf.remove(),2500);
  }

  setTimeout(()=>{
    btn.textContent='🎀 Happy Birthday, My Rose 🌹';
    btn.disabled=false;
  },3500);
}
</script>
</body>
</html>
